[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-m365"
version = "1.0.0"
description = "ORBIT - Office 365 Risk & Baseline Intelligence Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Reece Gabriel Dickson" }]
dependencies = [
    "textual>=0.60",
    "rich>=13",
    "keyring>=24",
    "cryptography>=42",
    "fpdf2>=2.7",
    "python-docx>=1.1",
    "jinja2>=3.1",
    "click>=8.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "ruff", "mypy", "pre-commit"]

[project.scripts]
orbit = "orbit.cli:main"

[tool.setuptools.packages.find]
include = ["orbit*"]

[tool.setuptools.package-data]
orbit = ["templates/*", "reporting/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
