name: Feature Request
description: Suggest something new or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. Please check existing issues first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or gap this addresses.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: checkboxes
    id: principles
    attributes:
      label: Does this respect ORBIT's core principles?
      options:
        - label: No outbound network connections from ORBIT itself
          required: true
        - label: No telemetry or analytics
          required: true
        - label: No plaintext secrets
          required: true
